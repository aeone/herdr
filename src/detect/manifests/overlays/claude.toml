# Rules this fork keeps on top of whichever claude manifest is in force.
#
# The bundled manifest is upstream's own, unchanged, and a newer one downloaded
# from upstream's catalog replaces it outright -- so rules that lived in the
# bundled copy vanished every time upstream published. These are applied to the
# manifest in force instead, whatever its source: a rule here replaces the
# manifest's rule of the same id, and any other is added.
#
# `base_version` is the upstream manifest these rules were last checked
# against. Once a newer one is in force they are still applied, but Herdr warns
# that nobody has looked at them beside it yet; check them, then bump this.
base_version = "2026.09.11.1"

# Claude's status line counts the shells the agent left running. Upstream's
# manifest no longer carries this rule; the fork keeps it because
# `agent_detection.shell_rules` names it to read that count, which never
# decides the state itself.
[[rules]]
id = "background_shell_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['^\s*[⏸⏵].*·\s+[1-9]\d*\s+shells?\s+(?:·|$)']

# A message from another Claude session that this session's settings hold for
# the user to approve. Until someone picks Deny or Deliver, the agent is
# waiting on its user exactly as it would at a permission prompt, so it is
# blocked -- otherwise it reads as idle and nothing says a message is sitting
# there. The title and the deliver option are both required: the title alone
# can stay in scrollback after the dialog is gone.
[[rules]]
id = "held_cross_session_message"
state = "blocked"
priority = 985
region = "whole_recent"
visible_blocker = true
contains = ["held message from another session", "deliver this message to claude"]
